spring.application.name=reports
spring.thymeleaf.cache=false

infinitestack.plugin.id=reports
infinitestack.plugin.base-path=${IS_PLUGIN_BASE_PATH:/api/plugins/reports}
infinitestack.plugin.assets-path=${infinitestack.plugin.base-path}/assets
infinitestack.plugin.data-root=${IS_PLUGIN_INSTALL_PATH:./data}

infinitestack.destination.db=${IS_DESTINATION_DB:postgres}

spring.datasource.url=${IS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${IS_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${IS_DATASOURCE_PASSWORD:}

infinitestack.host.base-url=${IS_HOST_BASE_URL:http://127.0.0.1:8081}
infinitestack.plugin.internal-token=${IS_PLUGIN_INTERNAL_TOKEN:}
infinitestack.plugin.runtime-id=${IS_PLUGIN_ID:reports}

server.error.include-message=always

# The pool is configured in PluginDataSourceConfig, not here (Hikari seals a started pool).

# Role used when a request arrives without the X-IS-* headers, which only happens outside the host
# (local development). Never ADMIN by default.
reports.local.fallback-role=${REPORTS_LOCAL_ROLE:USER}

# Engine limits (ARCHITECTURE section 27-28)
reports.limits.max-nodes-per-flow=50
reports.limits.block-timeout-seconds=30
reports.limits.execution-timeout-seconds=120
reports.limits.max-template-bytes=262144
reports.limits.max-rendered-bytes=5242880
reports.limits.max-pdf-bytes=26214400
reports.limits.pdf-timeout-seconds=60

# How long a catalog snapshot is reused before asking the catalog again
reports.catalog.cache-seconds=60

# Sentinel-2 for the sathub-latest-image Block: the Earth Search STAC API (Element 84), the catalog
# Satellite Hub uses. The Block also reads the COGs it points to (sentinel-cogs.s3.us-west-2.amazonaws.com),
# so the host needs outbound HTTPS to both.
reports.sentinel.stac-url=${REPORTS_SENTINEL_STAC_URL:https://earth-search.aws.element84.com/v1}

# BR Weather keeps the CHIRPS daily clips in the lake (BRWEATHER_CHIRPS_DIR); brweather-rainfall reads
# only files under this directory, the same one.
reports.brweather.chirps-dir=${REPORTS_CHIRPS_DIR:/opt/infinitestack/var/lake/bronze/br-weather-agent-app/chirps}

# is-geo-sam (Skills Lab) for the isgeosam-field-candidates Block. The project comes from the grant the
# IS admin writes in <grants-dir>/reports-workflows.json (the back reads the same file); project-id only
# overrides it. The Block leaves the request JSON in the lake staging (ISGEOSAM_STAGING_DIR of the script).
reports.isgeosam.workflow=${REPORTS_ISGEOSAM_WORKFLOW:is-geo-sam}
reports.isgeosam.project-id=${REPORTS_ISGEOSAM_PROJECT_ID:}
reports.isgeosam.grants-dir=${REPORTS_ISGEOSAM_GRANTS_DIR:/opt/infinitestack/etc}
reports.isgeosam.staging-dir=${REPORTS_ISGEOSAM_STAGING_DIR:/opt/infinitestack/var/lake/staging}
